name: Lima e2e installer and boot verification

# End-to-end installer + boot verification runs on a Linux runner inside a
# nested-virt Lima VM using QEMU/KVM. Runs on PRs that touch the
# installer/element graph so a broken install or boot is caught before merge.
on:
  pull_request:
    paths:
      - '.github/workflows/lima-e2e.yml'
      - '.github/scripts/lima-e2e-install-boot.sh'
      - '.github/scripts/bluefin-lima-template.yaml'
      - 'elements/installer/**'
      - 'elements/oci/bluefin-server-installer.bst'
      - 'elements/oci/bluefin-server-ddi.bst'
      - 'files/installer/**'
      - 'Justfile'
  push:
    branches: [main]
    paths:
      - '.github/workflows/lima-e2e.yml'
      - '.github/scripts/lima-e2e-install-boot.sh'
      - '.github/scripts/bluefin-lima-template.yaml'
      - 'elements/installer/**'
      - 'elements/oci/bluefin-server-installer.bst'
      - 'elements/oci/bluefin-server-ddi.bst'
      - 'files/installer/**'
      - 'Justfile'
  workflow_dispatch:

# PR-controlled code (the Justfile and e2e script come from the PR head) runs
# here, so the token stays read-only.
permissions:
  contents: read

jobs:
  lima-e2e:
    runs-on: ubuntu-24.04
    # Build the DDI installer (BuildStream over the network) and boot it twice
    # under QEMU; allow generous headroom and let the job fail loudly.
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Set up just
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2
        with:
          tool: just

      - name: Install QEMU and configure KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends qemu-system-x86 qemu-utils ovmf
          sudo modprobe kvm || true
          sudo chown $(whoami) /dev/kvm 2>/dev/null || true
          sudo chmod 666 /dev/kvm 2>/dev/null || true

      - name: Install Lima
        run: |
          LIMA_VERSION="2.2.0"
          curl -fsSL "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/lima-${LIMA_VERSION}-Linux-x86_64.tar.gz" | sudo tar -xz -C /usr/local
          limactl --version

      - name: Start Lima VM with nested virtualization
        run: |
          # A fresh instance per run; limactl refuses to start a named VM twice.
          limactl stop --force bluefin-server-e2e || true
          limactl delete --force bluefin-server-e2e || true
          limactl validate .github/scripts/bluefin-lima-template.yaml
          cp .github/scripts/bluefin-lima-template.yaml ~/bluefin-lima-template.yaml
          limactl create --name bluefin-server-e2e ~/bluefin-lima-template.yaml
          limactl start --tty=false bluefin-server-e2e

      - name: Run installer and boot verification
        run: |
          # limactl cp transfers the checkout into the writable guest filesystem,
          # where the whole chain (build + double boot) runs with KVM enabled.
          limactl cp -r "$PWD" bluefin-server-e2e:/home/ubuntu/repo
          limactl shell bluefin-server-e2e bash -lc 'cd /home/ubuntu/repo && ./.github/scripts/lima-e2e-install-boot.sh'
